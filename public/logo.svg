<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gymGrad)" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" />
  
  <!-- Dumbbell Icon -->
  <g transform="translate(136, 176)">
    <!-- Left Weight -->
    <rect x="0" y="30" width="30" height="100" rx="10" fill="url(#accentGrad)" />
    <rect x="25" y="45" width="20" height="70" rx="6" fill="#34d399" />
    
    <!-- Central Bar -->
    <rect x="45" y="70" width="150" height="20" rx="6" fill="#f8fafc" />
    
    <!-- Knurling texture on bar -->
    <line x1="85" y1="70" x2="85" y2="90" stroke="#cbd5e1" stroke-width="3" />
    <line x1="105" y1="70" x2="105" y2="90" stroke="#cbd5e1" stroke-width="3" />
    <line x1="125" y1="70" x2="125" y2="90" stroke="#cbd5e1" stroke-width="3" />
    <line x1="145" y1="70" x2="145" y2="90" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Right Weight -->
    <rect x="195" y="45" width="20" height="70" rx="6" fill="#34d399" />
    <rect x="210" y="30" width="30" height="100" rx="10" fill="url(#accentGrad)" />
  </g>
  
  <!-- Lightning / Pulse Energy -->
  <path d="M256 120 L275 160 L245 160 L260 200" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Brand Name -->
  <text x="256" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">FITMOS</text>
  <text x="256" y="430" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#10b981" text-anchor="middle" letter-spacing="6">ZAL OS • PWA</text>
</svg>

